name: ZapretTR

on:
  push:
    branches: [master, "codex/**"]
    tags: ["zaprettr-v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "scripts/**"
      - "ZapretTR.sln"
      - ".github/workflows/zaprettr.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "profiles/**"
      - "scripts/**"
      - "ZapretTR.sln"

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore ZapretTR.sln
      - name: Build
        run: dotnet build ZapretTR.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ZapretTR.sln --configuration Release --no-build --no-restore
      - name: Create self-contained package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version "0.1.0-ci"
      - uses: actions/upload-artifact@v7
        with:
          name: ZapretTR-win-x64
          path: artifacts/release/ZapretTR-v0.1.0-ci-win-x64.zip
          if-no-files-found: error
